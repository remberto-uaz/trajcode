[project]
name = "trajcode"
version = "0.1.0"
description = "Knowledge graphs as codebooks for semantic communication: path codes, decoder memory, misalignment, knowledge update and layered transmission"
authors = [
  { name = "Remberto Sandoval Aréchiga", email = "rsandoval@uaz.edu.mx" },
  { name = "José Ricardo Gómez Rodríguez" },
  { name = "Víktor Iván Rodríguez Abdalá" },
  { name = "Salvador Ibarra Delgado" },
  { name = "Ana Gabriela Castañeda Miranda" },
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "networkx==3.6.1",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "hypothesis==6.169.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trajcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
